# The test suite, run in the configuration a deployment actually uses.
#
# No system packages and no extras: METAS UncLib is not installed here and cannot be,
# since its licence does not permit redistribution to a CI runner any more than to a
# hosting provider. So this job exercises the pure-Python engine, which is the whole
# point -- the deployed configuration is the tested one.
#
# The equivalence tests that need both engines skip here and run on a licensed machine.
# The two that do not need a licence still run, and they are the ones a deployment rests
# on: the committed binary blobs are keyed by digests of the XML UncLib wrote, so
# reproducing those keys proves byte-identity without UncLib being present to ask.

name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Install dependencies
        # --frozen so a lockfile that has drifted from pyproject.toml fails here rather
        # than being quietly re-resolved into something nobody reviewed.
        run: uv sync --frozen

      - name: METAS UncLib is absent, as it must be
        # Guards against the licensed dependency creeping back into the base install.
        # If this ever passes, a deploy would be redistributing the library.
        run: |
          if uv run python -c "import metas_unclib" 2>/dev/null; then
            echo "::error::metas_unclib is installed in the base environment; it is licensed for a designated computer and must stay behind the 'unclib' extra"
            exit 1
          fi
          echo "confirmed absent"

      - name: The pure-Python engine is the one selected
        run: |
          uv run python -c "
          from vcqi.domain.engine import ENGINE, unclib_available
          assert ENGINE == 'linprop', ENGINE
          assert not unclib_available()
          print('engine:', ENGINE)
          "

      - name: Tests
        run: uv run pytest -q

      - name: The world builds and is byte-identical across two runs
        # Determinism is a documented property (README, ARCHITECTURE) and the thing that
        # makes --dump output diffable, so it is worth asserting rather than trusting.
        run: |
          uv run python -m vcqi.actors.scenarios --dump first/ > /dev/null
          uv run python -m vcqi.actors.scenarios --dump second/ > /dev/null
          diff -r first/ second/
          echo "$(ls first/ | wc -l) documents, identical across runs"

  container:
    # The image, exercised under the resources the smallest Render instance actually
    # has. A pass here means it fits there; measuring it in CI is cheaper than finding
    # out from a restart loop after a deploy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vcqi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Size
        run: docker images vcqi:ci --format '{{.Size}}'

      - name: Serve it, and check the things a deployment depends on
        run: |
          set -euo pipefail
          docker run -d --name vcqi -p 8000:8000 \
            --cpus=0.5 --memory=512m \
            -e VCQI_RATE_LIMIT_BURST=0 \
            vcqi:ci

          for _ in $(seq 1 40); do
            curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break
            sleep 2
          done

          echo '--- health, and which engine is computing ---'
          curl -fsS localhost:8000/healthz
          test "$(curl -fsS localhost:8000/healthz | python3 -c 'import json,sys; print(json.load(sys.stdin)["engine"])')" = linprop

          echo '--- the interface is in the image ---'
          curl -fsS localhost:8000/ | grep -q 'Verifiable credentials'
          curl -fsS -o /dev/null localhost:8000/static/js/chapters.js
          curl -fsS -o /dev/null localhost:8000/static/css/app.css

          echo '--- the scripts must be revalidated, not reused on a guess ---'
          # StaticFiles sends an ETag but no Cache-Control, and without one a browser
          # may reuse a module on heuristic freshness. An older app.js beside a newer
          # chapters.js is a chapter that fails to render, and after a deploy that is
          # exactly the pair a returning visitor would hold.
          for js in app chapters content ui; do
            curl -fsS -D- -o /dev/null "localhost:8000/static/js/$js.js" | grep -qi '^cache-control: no-cache'
          done
          curl -fsS -D- -o /dev/null localhost:8000/api/content | grep -qi '^cache-control: no-store'

          echo '--- headers ---'
          curl -fsS -D- -o /dev/null localhost:8000/ | grep -qi "^content-security-policy:.*default-src 'none'"
          curl -fsS -D- -o /dev/null localhost:8000/ | grep -qi '^x-robots-tag: noindex'
          ! curl -fsS -D- -o /dev/null localhost:8000/ | grep -qi 'access-control-allow-origin'
          ! curl -fsS -D- -o /dev/null localhost:8000/ | grep -qi '^server: uvicorn'
          curl -fsS localhost:8000/robots.txt | grep -q 'Disallow: /'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = 404

          echo '--- the endpoints that do real work ---'
          J='content-type: application/json'
          curl -fsS -X POST localhost:8000/api/uncertainty -H "$J" -d '{}' | grep -q expandedUncertainty
          curl -fsS -X POST localhost:8000/api/combine     -H "$J" -d '{}' | grep -q correlation
          curl -fsS -X POST localhost:8000/api/verify      -H "$J" -d '{"name":"metas-calibration"}' | grep -q verified
          curl -fsS -X POST localhost:8000/api/keys/derive -H "$J" -d '{"passphrase":"ci"}' | grep -q didKey

          echo '--- the body cap ---'
          head -c 400000 /dev/zero | tr '\0' 'a' > /tmp/big
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/verify -H "$J" --data-binary @/tmp/big)" = 413

          echo '--- what it used on half a core and 512 MB ---'
          docker stats --no-stream --format '{{.MemUsage}}  {{.CPUPerc}}' vcqi

      - name: Rate limiting engages when configured
        run: |
          set -euo pipefail
          docker rm -f vcqi >/dev/null
          docker run -d --name vcqi -p 8000:8000 --cpus=0.5 --memory=512m \
            -e VCQI_RATE_LIMIT_BURST=10 -e VCQI_RATE_LIMIT_PER_SECOND=1.0 vcqi:ci
          for _ in $(seq 1 40); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 2; done
          J='content-type: application/json'
          codes=""
          for _ in 1 2 3 4; do
            codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/keys/derive -H "$J" -d '{"passphrase":"x"}')"
          done
          echo "four key derivations at cost 5 with a burst of 10:$codes"
          echo "$codes" | grep -q 429
          # And a reader dragging a slider is still never charged.
          for _ in $(seq 1 30); do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/uncertainty -H "$J" -d '{}')" = 200
          done
          echo "thirty slider posts, none refused"

      - if: always()
        run: docker logs vcqi 2>&1 | tail -30; docker rm -f vcqi || true
